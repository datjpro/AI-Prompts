<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stop Digging Through Dashboards</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&family=Syne:wght@400..900&display=swap" rel="stylesheet">
  <script>
    (function() {
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('motion-pending');
        window.__motionTimeout = setTimeout(function() {
          document.documentElement.classList.remove('motion-pending');
        }, 3500);
      }
    })();
  </script>
  <style>
    /* Font Definitions */
    @font-face {
      font-family: 'Reference Sans';
      src: local('Reference Sans'), local('Plus Jakarta Sans'), url('https://fonts.gstatic.com/s/plusjakartasans/v8/L0x5DF4xlV2_m25s26g_5T5v-Zk.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
    }

    @font-face {
      font-family: 'Reference Display';
      src: local('Reference Display'), local('Syne'), url('https://fonts.gstatic.com/s/syne/v17/8vIJ7w4qzg3CV5MUB3xW0A.woff2') format('woff2');
      font-weight: 400 900;
      font-style: normal;
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Fixed Viewport */
    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      /* Desktop CSS variables */
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    /* Screen Vignette Overlay */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
    }

    /* Video Background */
    video.background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    /* Header */
    header.header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 20;
    }

    a.brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      top: 10px;
      text-decoration: none;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
      transition: transform 0.2s ease;
    }
    a.brand:hover {
      transform: scale(1.05);
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }

    nav.nav {
      margin-left: clamp(36px, 3.03vw, 48px);
      display: flex;
      align-items: center;
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    nav.nav a {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229,229,230,.77);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      text-decoration: none;
      position: relative;
      transition: color 140ms ease, filter 140ms ease;
    }
    nav.nav a:hover {
      color: #fff;
      filter: brightness(1.08);
    }
    nav.nav a:nth-child(1) {
      top: -3px;
    }
    nav.nav a:nth-child(4) {
      margin-left: 1px;
    }
    nav.nav a.active {
      color: #fff;
    }
    nav.nav a.active::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 44px;
      height: 2px;
      background: rgba(255,255,255,.82);
      border-radius: 1px;
    }

    /* Time Panel */
    div.time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230,230,230,.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    div.time-panel label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240,240,240,.77);
      line-height: 1.25;
      display: block;
    }
    div.time-panel span.value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255,255,255,.93);
      line-height: 1.25;
      display: block;
    }

    /* Sign Up Button */
    button.sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-weight: 460;
      letter-spacing: -.34px;
      font-size: var(--action-control-font-size);
      font-family: inherit;
      border: none;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      margin-left: clamp(20px, 1.95vw, 29px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: filter 140ms ease, opacity 140ms ease;
    }
    button.sign-up:hover {
      filter: brightness(1.08);
    }

    /* Menu Toggle (Tablet/Mobile) */
    button.menu-toggle {
      display: none;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      background: rgba(24,22,20,.6);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #fff;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: auto;
      transition: filter 140ms ease, border-color 140ms ease;
    }
    button.menu-toggle:hover {
      filter: brightness(1.08);
      border-color: rgba(255,255,255,.3);
    }

    /* Hero Section */
    section.hero {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    div.hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      pointer-events: auto;
      z-index: 10;
    }

    /* Headline */
    h1.hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
      margin: 0 0 var(--title-copy-gap) 0;
    }

    span.line {
      display: block;
      transform-origin: left center;
    }

    span.line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    span.line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    span.line-reveal {
      display: block;
    }

    /* Body Copy */
    p.hero-copy {
      color: rgba(226, 229, 228, .84);
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      font-weight: 350;
      letter-spacing: .13px;
      width: clamp(390px, 31.67vw, 500px);
      position: relative;
      left: 1px;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      margin: 0 0 var(--copy-cta-gap) 0;
    }

    /* Primary CTA */
    button.primary-cta {
      position: relative;
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      border: none;
      cursor: pointer;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      transition: filter 140ms ease;
      font-family: inherit;
    }
    button.primary-cta:hover {
      filter: brightness(1.08);
    }

    button.primary-cta span.label {
      position: absolute;
      left: 8.125%;
      font-weight: 450;
      letter-spacing: -.3px;
      font-size: var(--primary-control-font-size);
      color: #111;
      white-space: nowrap;
    }

    button.primary-cta span.arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Demo Card */
    article.demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      z-index: 10;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
      padding: 4cqw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      transform-origin: 82% 50%;
    }

    div.demo-visual {
      position: relative;
      width: 92.5cqw;
      height: 92cqw;
      margin: 0 auto;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    div.demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    button.play {
      position: absolute;
      width: 29cqw;
      height: 29cqw;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 140ms ease, background-color 140ms ease, filter 140ms ease;
    }
    button.play:hover {
      transform: translate(-50%, -50%) scale(1.08);
      background: rgba(3,5,7,.65);
      filter: brightness(1.1);
    }

    button.watch-button {
      width: 92.5cqw;
      height: 36cqw;
      margin: 0 auto;
      border-radius: 4cqw;
      border: 1px solid rgba(255,255,255,.21);
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      color: #fff;
      font-size: 14cqw;
      font-weight: 430;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-family: inherit;
      letter-spacing: -.2px;
      transition: filter 140ms ease, border-color 140ms ease;
    }
    button.watch-button:hover {
      filter: brightness(1.08);
      border-color: rgba(255,255,255,.35);
    }

    /* Focus Visible */
    a:focus-visible, button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    /* Motion & Choreographed Entrance Animations */
    html.motion-pending a.brand {
      opacity: 0;
    }
    html.motion-pending nav.nav a {
      opacity: 0;
    }
    html.motion-pending div.time-panel {
      opacity: 0;
    }
    html.motion-pending button.sign-up {
      opacity: 0;
    }
    html.motion-pending button.menu-toggle {
      opacity: 0;
    }
    html.motion-pending span.line {
      overflow: hidden;
    }
    html.motion-pending span.line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg);
    }
    html.motion-pending p.hero-copy {
      opacity: 0;
      transform: translate3d(0, 10px, 0);
    }
    html.motion-pending button.primary-cta {
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(.985);
    }
    html.motion-pending article.demo-card {
      opacity: 0;
      transform: translate3d(0, 12px, 0) scale(.968);
    }

    /* Keyframes */
    @keyframes entrance-brand {
      from {
        opacity: 0;
        transform: translate3d(0, -7px, 0) scale(.94);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-nav {
      from {
        opacity: 0;
        transform: translate3d(0, -6px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-action {
      from {
        opacity: 0;
        transform: translate3d(0, -8px, 0) scale(.985);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-line {
      from {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }
      to {
        transform: translate3d(0, 0, 0) skewY(0deg);
      }
    }

    @keyframes entrance-copy {
      from {
        opacity: 0;
        transform: translate3d(0, 10px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-action-up {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(.985);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-card {
      from {
        opacity: 0;
        transform: translate3d(0, 12px, 0) scale(.968);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Animation Application */
    html.motion-pending a.brand {
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards;
    }
    html.motion-pending nav.nav a:nth-child(1) {
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards;
    }
    html.motion-pending nav.nav a:nth-child(2) {
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards;
    }
    html.motion-pending nav.nav a:nth-child(3) {
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }
    html.motion-pending nav.nav a:nth-child(4) {
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards;
    }
    html.motion-pending div.time-panel {
      animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }
    html.motion-pending button.sign-up {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }
    html.motion-pending button.menu-toggle {
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards;
    }
    html.motion-pending span.line-one .line-reveal {
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards;
    }
    html.motion-pending span.line-two .line-reveal {
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards;
    }
    html.motion-pending p.hero-copy {
      animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards;
    }
    html.motion-pending button.primary-cta {
      animation: entrance-action-up 560ms cubic-bezier(.16,1,.3,1) 960ms forwards;
    }
    html.motion-pending article.demo-card {
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards;
    }

    /* Responsive Breakpoints */
    /* Tablet */
    @media (min-width: 620px) and (max-width: 790px), (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      header.header {
        align-items: center;
      }
      button.menu-toggle {
        display: inline-flex;
      }
      .header-actions {
        position: absolute;
        top: 56px;
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-end)));
        background: linear-gradient(145deg, rgba(24,22,20,.94), rgba(5,12,14,.96));
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 16px;
        backdrop-filter: blur(18px) saturate(110%);
        -webkit-backdrop-filter: blur(18px) saturate(110%);
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,.6);
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        pointer-events: none;
      }
      header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }
      nav.nav {
        margin-left: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        top: 0;
      }
      nav.nav a:nth-child(1) {
        top: 0;
      }
      nav.nav a:nth-child(4) {
        margin-left: 0;
      }
      div.time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(230,230,230,.2);
        padding-left: 0;
        padding-top: 12px;
        height: auto;
      }
      button.sign-up {
        margin-left: 0;
        width: 100%;
      }
    }

    /* Mobile */
    @media (max-width: 619px) {
      .screen {
        --gutter-start: 24px;
        --gutter-end: 24px;
        --header-top: 20px;
        --hero-bottom: clamp(24px, 4vh, 40px);
        --display-size: clamp(36px, 10vw, 54px);
        --display-leading: clamp(44px, 12vw, 62px);
        --copy-size: 14px;
        --copy-leading: 20px;
        --title-copy-gap: 14px;
        --copy-cta-gap: 20px;
        --cta-width: 150px;
        --cta-height: 40px;
        --card-width: clamp(140px, 42vw, 170px);
      }

      header.header {
        align-items: center;
      }

      button.menu-toggle {
        display: inline-flex;
      }

      .header-actions {
        position: absolute;
        top: 56px;
        right: 0;
        width: min(340px, calc(100vw - 32px));
        background: linear-gradient(145deg, rgba(24,22,20,.94), rgba(5,12,14,.96));
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 16px;
        backdrop-filter: blur(18px) saturate(110%);
        -webkit-backdrop-filter: blur(18px) saturate(110%);
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,.6);
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        pointer-events: none;
      }

      header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      nav.nav {
        margin-left: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        top: 0;
      }

      nav.nav a:nth-child(1) {
        top: 0;
      }

      nav.nav a:nth-child(4) {
        margin-left: 0;
      }

      div.time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(230,230,230,.2);
        padding-left: 0;
        padding-top: 12px;
        height: auto;
      }

      button.sign-up {
        margin-left: 0;
        width: 100%;
      }

      span.line-one {
        transform: scaleX(.78);
      }

      span.line-two {
        transform: scaleX(.55);
      }

      p.hero-copy {
        width: calc(100vw - 48px);
      }

      p.hero-copy br {
        display: none;
      }

      article.demo-card {
        top: clamp(140px, 24vh, 220px);
        bottom: auto;
        right: var(--gutter-end);
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      <!-- Background Video -->

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const demoCard = document.querySelector('.demo-card');
      if (demoCard) {
        demoCard.addEventListener('animationend', function() {
          document.documentElement.classList.remove('motion-pending');
          if (window.__motionTimeout) clearTimeout(window.__motionTimeout);
        });
      }

      // Responsive Mobile / Tablet Menu Navigation Toggle
      const header = document.getElementById('header');
      const menuToggle = document.querySelector('.menu-toggle');
      const tabletNav = document.getElementById('tablet-navigation');
      const isMobileTablet = () => window.innerWidth <= 1100;

      function setMenuState(open) {
        if (!header || !menuToggle) return;
        if (open) {
          header.classList.add('menu-open');
          menuToggle.setAttribute('aria-expanded', 'true');
          if (tabletNav) tabletNav.removeAttribute('inert');
          const firstLink = tabletNav ? tabletNav.querySelector('a') : null;
          if (firstLink) firstLink.focus();
        } else {
          header.classList.remove('menu-open');
          menuToggle.setAttribute('aria-expanded', 'false');
          if (tabletNav && isMobileTablet()) {
            tabletNav.setAttribute('inert', '');
          } else if (tabletNav) {
            tabletNav.removeAttribute('inert');
          }
        }
      }

      if (menuToggle) {
        menuToggle.addEventListener('click', function(e) {
          e.stopPropagation();
          const isOpen = header.classList.contains('menu-open');
          setMenuState(!isOpen);
        });
      }

      // Close on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header && header.classList.contains('menu-open')) {
          setMenuState(false);
        }
      });

      // Close when clicking outside
      document.addEventListener('pointerdown', function(e) {
        if (header && header.classList.contains('menu-open')) {
          if (!header.contains(e.target)) {
            setMenuState(false);
          }
        }
      });

      // Close when clicking any link inside navigation
      if (tabletNav) {
        const links = tabletNav.querySelectorAll('a, button');
        links.forEach(link => {
          link.addEventListener('click', function() {
            if (header.classList.contains('menu-open')) {
              setMenuState(false);
            }
          });
        });
      }

      // Handle window resize inert property
      window.addEventListener('resize', function() {
        if (!isMobileTablet() && tabletNav) {
          tabletNav.removeAttribute('inert');
          if (header) header.classList.remove('menu-open');
        } else if (tabletNav && (!header || !header.classList.contains('menu-open'))) {
          tabletNav.setAttribute('inert', '');
        }
      });

      // Initial check for inert state on tablet nav
      if (isMobileTablet() && tabletNav) {
        tabletNav.setAttribute('inert', '');
      }
    });
  </script>
