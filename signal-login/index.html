<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal — Log in</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23000'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>">

  <!-- Pre-paint Entrance Guard -->
  <script>
    document.documentElement.classList.add('entry-pending');
    window.__entryFallback = setTimeout(function() {
      document.documentElement.classList.remove('entry-pending');
    }, 3500);
  </script>

  <!-- Typography: Web fonts fallback for FreeSans & Eloquia Variable -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200..800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'FreeSans';
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: local('FreeSans'), local('Helvetica Neue'), local('Arial');
    }
    @font-face {
      font-family: 'FreeSans';
      font-style: normal;
      font-weight: 700;
      font-display: block;
      src: local('FreeSans Bold'), local('FreeSans-Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
    }
    @font-face {
      font-family: 'Eloquia';
      font-style: normal;
      font-weight: 200 800;
      font-display: block;
      src: local('Eloquia'), local('Outfit'), local('Plus Jakarta Sans');
    }

    /* 3. Design Tokens (:root) */
    :root {
      --W: 1464; --H: 949; --photoW: 836; --paneW: 628; --cardW: 613; --cardH: 922;
      --badge-fs: 13.60px; --badge-fw: 400; --badge-ls: -0.163px; --badge-gap: 10px; --badge-dy: 0px; --badge-ws: 0px;
      --badge-left: 34px; --badge-top: 684px;
      --hl-lh: 1; --hl-wght: 578;
      --hl1-fs: 69.14px; --hl1-ls: -1.936px; --hl1-ws: 0px; --hl1-left: 33.00px; --hl1-top: 750.02px;
      --hl2-fs: 68.95px; --hl2-ls: -1.931px; --hl2-left: 32.00px; --hl2-top: 831.01px;
      --h1-top: 65.00px; --h1-fs: 42.55px; --h1-ls: -2.553px; --h1-ws: 1.300px; --h1-wght: 584;
      --sub-top: 120.00px; --sub-fs: 20.41px; --sub-ls: -0.245px; --sub-ws: -2.000px; --sub-fw: 400; --sub-fwb: 700;
      --fieldpad: 19px;
      --eph-fs: 15.68px; --eph-ls: -0.188px; --eph-left: 17.0px; --eph-fw: 400; --eph-ws: 0px;
      --pph-fs: 17.29px; --pph-ls: -0.698px; --pph-left: 18px; --pph-fw: 400;
      --login-fs: 16.38px; --login-fw: 400; --login-ls: 0.200px; --login-gap: 10px; --login-dy: 0.00px; --login-padl: -12.00px;
      --arrow-w: 13.2px;
      --div-top: 477px; --or-fs: 11.5px; --or-fw: 700; --or-ls: 0.8px; --or-dy: 2.00px; --or-dx: 0.00px;
      --or-line-l: 205px; --or-line-r: 204px;
      --g-gap: 17px; --g-icon: 18.5px;
      --gt-fs: 18.10px; --gt-fw: 400; --gt-ls: -0.217px; --gt-ws: -1.000px; --gt-dy: 1.00px;
      --bt-top: 611.00px; --bt-fs: 16.37px; --bt-fw: 400; --bt-ls: -0.196px; --bt-ws: -2.060px; --bt-fwb: 700; --bt-uo: 3px;
      --card-shadow: 1px 10px 14px rgba(10,14,20,0.14), 0 1px 3px rgba(10,14,20,0.05);
      --cs: 1;

      --ink: #000000;
      --h1-color: #2c3343;
      --sub-grey: #797979;
      --badge-bg: #2f2a27;
      --ph: #606060;
      --or: #5a5a5b;
      --gtext: #232424;
      --bottom: #0a0a0a;
      --btn1: #283139;
      --btn2: #293340;
      --inputFill: #fafafa;
      --inputBorder: #acacae;
      --pwFill: #f9f9f9;
      --gBorder: #c8c8ca;
      --divider: #b1b1b2;
      --page: #fefefe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--page);
    }

    body {
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    /* 5. Desktop Base Layout */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--page);
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 57.1038%;
      overflow: hidden;
      background: #0d1117;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    .photo-img--wide {
      display: none;
    }

    .scrim {
      display: none;
    }

    .hero {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
      z-index: 2;
    }

    .hero > * {
      pointer-events: auto;
    }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      display: inline-flex;
      align-items: center;
      gap: var(--badge-gap);
      height: 37px;
      padding: 0 16px 0 19px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(7px) saturate(120%);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      box-shadow: 0 1px 2px rgba(0,0,0,0.18), 0 6px 18px rgba(0,0,0,0.14);
      color: #ffffff;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--badge-fs);
      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      white-space: nowrap;
    }

    .badge-icon {
      width: 17px;
      height: 16.27px;
      position: relative;
      top: -1px;
      flex-shrink: 0;
    }

    .hl-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hl {
      position: absolute;
      font-family: 'Eloquia', 'Outfit', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght);
      font-weight: 600;
      line-height: var(--hl-lh);
      color: var(--ink);
      white-space: nowrap;
      pointer-events: auto;
    }

    #hl1 {
      left: var(--hl1-left);
      top: var(--hl1-top);
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
      word-spacing: var(--hl1-ws);
    }

    #hl2 {
      left: var(--hl2-left);
      top: var(--hl2-top);
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
    }

    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 3;
    }

    .card {
      position: absolute;
      left: 1px;
      top: 14px;
      width: var(--cardW);
      height: var(--cardH);
      border-radius: 26px;
      overflow: hidden;
      background: rgba(254, 254, 254, 0.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
    }

    .card-in {
      position: absolute;
      left: 0;
      top: 0;
      width: 613px;
      height: 922px;
      transform-origin: left top;
    }

    .col {
      position: absolute;
      left: 62px;
      width: 488px;
    }

    .center {
      text-align: center;
    }

    #h1 {
      top: var(--h1-top);
      font-family: 'Eloquia', 'Outfit', sans-serif;
      font-variation-settings: 'wght' var(--h1-wght);
      font-weight: 600;
      font-size: var(--h1-fs);
      letter-spacing: var(--h1-ls);
      word-spacing: var(--h1-ws);
      color: var(--h1-color);
      line-height: 1.1;
    }

    #sub {
      top: var(--sub-top);
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--sub-fs);
      letter-spacing: var(--sub-ls);
      word-spacing: var(--sub-ws);
      color: var(--sub-grey);
      font-weight: var(--sub-fw);
      line-height: 1.35;
    }

    #sub b {
      font-weight: var(--sub-fwb);
      color: var(--ink);
    }

    .field {
      position: absolute;
      left: 62px;
      width: 489px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }

    .field input {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
    }

    #email {
      top: 203px;
      height: 61px;
      background: var(--inputFill);
      border: 1.5px solid var(--inputBorder);
      padding: 0 var(--fieldpad);
    }

    #email input {
      font-size: var(--eph-fs);
      letter-spacing: var(--eph-ls);
    }

    #email input::placeholder {
      color: var(--ph);
      font-size: var(--eph-fs);
      letter-spacing: var(--eph-ls);
      font-weight: var(--eph-fw);
    }

    #pw {
      top: 273.5px;
      height: 59px;
      background: var(--pwFill);
      border: 0;
      padding: 0 var(--fieldpad);
    }

    #pw input {
      font-size: var(--pph-fs);
      letter-spacing: var(--pph-ls);
    }

    #pw input::placeholder {
      color: var(--ph);
      font-size: var(--pph-fs);
      letter-spacing: var(--pph-ls);
      font-weight: var(--pph-fw);
    }

    #loginBtn {
      position: absolute;
      left: 62px;
      top: 366px;
      width: 489px;
      height: 65.5px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--login-gap);
      padding-left: var(--login-padl);
      padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18,26,34,0.16), 0 2px 5px rgba(18,26,34,0.10);
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--login-fs);
      font-weight: var(--login-fw);
      letter-spacing: var(--login-ls);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.18s ease, filter 0.18s ease;
    }

    #loginBtn:hover {
      filter: brightness(1.12);
    }

    #loginBtn:active {
      transform: translateY(1px);
    }

    #loginBtn .arrow {
      width: var(--arrow-w);
      height: var(--arrow-w);
    }

    .divider {
      position: absolute;
      left: 63px;
      top: var(--div-top);
      width: 487px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .divider i {
      height: 1.5px;
      background: var(--divider);
      display: block;
    }

    .divider i:first-child {
      flex: 0 0 var(--or-line-l);
    }

    .divider i:last-child {
      flex: 0 0 var(--or-line-r);
    }

    .divider b {
      flex: 1 1 auto;
      text-align: center;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--or-fs);
      font-weight: var(--or-fw);
      letter-spacing: var(--or-ls);
      color: var(--or);
      position: relative;
      top: var(--or-dy);
      left: var(--or-dx);
    }

    #gBtn {
      position: absolute;
      left: 62px;
      top: 535px;
      width: 489px;
      height: 59.5px;
      border: 1.5px solid var(--gBorder);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--g-gap);
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--gt-fs);
      font-weight: var(--gt-fw);
      letter-spacing: var(--gt-ls);
      word-spacing: var(--gt-ws);
      color: var(--gtext);
      cursor: pointer;
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    #gBtn:hover {
      background: #ffffff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    }

    #gBtn:active {
      transform: translateY(1px);
    }

    #gBtn .g-icon {
      width: var(--g-icon);
      height: var(--g-icon);
    }

    #gBtn span {
      position: relative;
      top: var(--gt-dy);
    }

    #bottom {
      position: absolute;
      left: 62px;
      width: 489px;
      top: var(--bt-top);
      text-align: center;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: var(--bt-fs);
      font-weight: var(--bt-fw);
      letter-spacing: var(--bt-ls);
      word-spacing: var(--bt-ws);
      color: var(--bottom);
    }

    #bottom a {
      color: #000000;
      font-weight: var(--bt-fwb);
      text-decoration: underline;
      text-underline-offset: var(--bt-uo);
      text-decoration-thickness: 2px;
    }

    :focus-visible {
      outline: 2px solid #2b6cb0;
      outline-offset: 2px;
    }

    /* 6. Mode B — Tablet Portrait (body.tabport) */
    body.tabport {
      overflow-y: auto;
    }

    body.tabport .stage {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.tabport .photo {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      height: var(--band-h, 42.5vh);
    }

    body.tabport .photo-img--tall { display: none; }
    body.tabport .photo-img--wide { display: block; object-position: 50% 50%; }

    body.tabport .hero {
      position: absolute;
      left: var(--side-m, 5vw);
      bottom: var(--tp-hero-b, 20px);
      width: calc(100% - (var(--side-m, 5vw) * 2));
      height: auto;
      transform: none !important;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    body.tabport .badge {
      position: static;
      transform: scale(var(--badge-k, 1));
      transform-origin: left center;
    }

    body.tabport .hl-wrap {
      position: static;
      width: var(--hl-measure, 100%);
    }

    body.tabport .hl {
      position: static;
      display: inline;
      font-size: var(--tp-hero-fs, 36px);
      line-height: var(--tp-hero-lh, 1.12);
    }

    body.tabport .pane {
      position: relative;
      left: 0;
      width: 100%;
      flex: 1;
      padding: 24px var(--side-m, 5vw);
    }

    body.tabport .card {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      height: auto;
      min-height: 500px;
    }

    body.tabport .card-in {
      position: relative;
      inset: 0;
      width: 100%;
      height: auto;
      transform: none !important;
      padding: 40px 30px;
    }

    /* 6. Mode C — Mobile Stacked (body.stacked) */
    body.stacked {
      height: auto;
      min-height: 100%;
      overflow-y: auto;
      background: #ffffff;
    }

    body.stacked .stage {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    body.stacked .photo {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      height: clamp(244px, 34svh, 304px);
    }

    body.stacked .photo-img--tall { display: none; }
    body.stacked .photo-img--wide { display: block; object-position: 64% 48%; transform: scale(1.015); }

    body.stacked .scrim {
      display: block;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,10,13,0.02) 18%, rgba(7,10,13,0.12) 48%, rgba(7,10,13,0.78) 100%);
      z-index: 1;
    }

    body.stacked .hero {
      position: absolute;
      left: 20px;
      bottom: 42px;
      width: calc(100% - 40px);
      height: auto;
      transform: none !important;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    body.stacked .badge {
      position: static;
      height: 31px;
      padding: 0 12px;
      background: rgba(24, 27, 30, 0.82);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      font-size: 11px;
    }

    body.stacked .hl-wrap {
      position: static;
    }

    body.stacked .hl {
      position: static;
      display: block;
      color: #ffffff;
      font-size: clamp(30px, 8.8vw, 38px);
      letter-spacing: -0.035em;
      line-height: 0.96;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.32);
    }

    body.stacked .pane {
      position: relative;
      left: 0;
      width: 100%;
      flex: 1;
    }

    body.stacked .card {
      position: relative;
      left: 0;
      top: 0;
      width: 100%;
      margin: -28px 0 0;
      border-radius: 28px 28px 0 0;
      background: #ffffff;
      border: 0;
      box-shadow: 0 -10px 28px rgba(20, 28, 36, 0.10);
      min-height: calc(100svh - clamp(244px, 34svh, 304px) + 28px);
    }

    body.stacked .card-in {
      position: relative;
      width: 100%;
      height: auto;
      max-width: 500px;
      margin: 0 auto;
      padding: 36px clamp(24px, 7vw, 38px) max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: none !important;
      gap: 16px;
    }

    body.stacked .col,
    body.stacked .field,
    body.stacked #loginBtn,
    body.stacked .divider,
    body.stacked #gBtn,
    body.stacked #bottom {
      position: static;
      left: auto;
      top: auto;
      width: 100%;
    }

    body.stacked #h1 {
      font-size: clamp(31px, 8.8vw, 38px);
      margin-bottom: 4px;
    }

    body.stacked #sub {
      font-size: 15px;
      margin-bottom: 8px;
    }

    body.stacked .field {
      height: 56px;
    }

    body.stacked .field input {
      font-size: 16px !important;
    }

    body.stacked #loginBtn {
      height: 58px;
      margin-top: 4px;
    }

    body.stacked .divider {
      margin: 6px 0;
    }

    body.stacked #gBtn {
      height: 56px;
    }

    body.stacked #bottom {
      font-size: 14px;
      margin-top: 8px;
    }

    /* 7. Entrance Animation Pre-paint Guard & Keyframe Targets */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0;
      will-change: transform, opacity, clip-path;
    }

    .entry-pending .card { transform: translateY(12px) scale(0.988); }
    .entry-pending .badge { transform: translateY(8px); }
    .entry-pending #hl1,
    .entry-pending #hl2 {
      transform: translateY(16px);
      clip-path: inset(100% 0 0 0);
    }
    .entry-pending #h1,
    .entry-pending #sub { transform: translateY(10px); }
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending #gBtn { transform: translateY(8px); }
    .entry-pending .divider,
    .entry-pending #bottom { transform: translateY(6px); }

    @media (max-width: 699px) {
      .entry-pending .card { transform: translateY(14px); }
      .entry-pending #hl1,
      .entry-pending #hl2 { transform: translateY(12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
      .entry-pending .card,
      .entry-pending .badge,
      .entry-pending #hl1,
      .entry-pending #hl2,
      .entry-pending #h1,
      .entry-pending #sub,
      .entry-pending #email,
      .entry-pending #pw,
      .entry-pending #loginBtn,
      .entry-pending .divider,
      .entry-pending #gBtn,
      .entry-pending #bottom {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Photo Panel (Layer 0 + Hero) -->
    <section class="photo" id="photoPanel">
      <video class="photo-img photo-img--tall" autoplay muted loop playsinline preload="auto">

  <!-- 6. Responsive Engine (IIFE 1) -->
  <script>
    (function() {
      var REF_W = 1464, REF_H = 949, PHOTO_W = 836, PANE_W = 628, CARD_W = 613, CARD_H = 922;
      var CONTENT_H = 697;
      var IMG_W = 1177, IMG_H = 1336, IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681, HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280, RAMP_LO = 1000, PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820, PHOTO_MIN2 = 0.36;

      var TP = {
        pad: 0.1076, h1Top: 0.08656, h1Fs: 0.06839, subTop: 0.17368, subFs: 0.0309,
        emTop: 0.25435, emH: 0.10257, emR: 0.0202, ephFs: 0.02702, ephPad: 0.0332,
        pwTop: 0.36851, pwH: 0.10839, btnTop: 0.50435, btnH: 0.10981, btnFs: 0.0275,
        arrow: 0.026, btnGap: 0.02, divTop: 0.68222, orFs: 0.02245, orPad: 0.051,
        divH: 0.0026, gTop: 0.76445, gH: 0.09966, gIcon: 0.032, gtFs: 0.03205,
        gGap: 0.026, btTop: 0.89668, btFs: 0.02876, heroFs: 0.1058, badgeH: 0.0742,
        heroLh: 1.1246, heroBot: 0.06493, heroGap: -0.30423, heroSide: 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

      var photoEl = document.getElementById('photoPanel');
      var paneEl = document.getElementById('pane');
      var cardEl = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var heroEl = document.getElementById('hero');

      var currentMode = '';

      function clearInline() {
        if (photoEl) photoEl.style.cssText = '';
        if (paneEl) paneEl.style.cssText = '';
        if (cardEl) cardEl.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (heroEl) heroEl.style.cssText = '';
      }

      function photoRatio(vw) {
        if (vw >= RAMP_HI) return 1 - PANE_RATIO;
        if (vw <= RAMP_LO2) return PHOTO_MIN2;
        if (vw <= RAMP_LO) {
          var t = (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2);
          return PHOTO_MIN2 + t * (PHOTO_MIN - PHOTO_MIN2);
        }
        var t = (vw - RAMP_LO) / (RAMP_HI - RAMP_LO);
        return PHOTO_MIN + t * ((1 - PANE_RATIO) - PHOTO_MIN);
      }

      function placeCard(paneW, vh) {
        var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
        var gapL = 1 * cs;
        var mT = 14 * cs;
        var mB = 13 * cs;
        var mR = 14 * cs;
        var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
        var ch = vh - mT - mB;
        var r = 26 * cs;
        var b = Math.max(1, cs);

        cardEl.style.left = gapL + 'px';
        cardEl.style.top = mT + 'px';
        cardEl.style.width = cw + 'px';
        cardEl.style.height = ch + 'px';
        cardEl.style.borderRadius = r + 'px';
        cardEl.style.borderWidth = b + 'px';

        cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';
      }

      function seatHero(photoW, vh) {
        var imgScale = Math.max(photoW / IMG_W, vh / IMG_H);
        var s = Math.min(imgScale / IMG_REF_SCALE, (photoW * 0.92) / HERO_W);
        heroEl.style.transform = 'scale(' + s + ')';
        heroEl.style.transformOrigin = 'left bottom';
        heroEl.style.bottom = '0px';
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw < 700) {
          if (currentMode !== 'phone') {
            clearInline();
            document.body.classList.remove('tabport');
            document.body.classList.add('stacked');
            currentMode = 'phone';
          }
          return;
        }

        if (mqPortrait.matches) {
          if (currentMode !== 'tabport') {
            clearInline();
            document.body.classList.remove('stacked');
            document.body.classList.add('tabport');
            currentMode = 'tabport';
          }
          var bandH = Math.round(vh * 0.425);
          var sideM = Math.round(vw * 0.0525);
          document.documentElement.style.setProperty('--band-h', bandH + 'px');
          document.documentElement.style.setProperty('--side-m', sideM + 'px');
          document.documentElement.style.setProperty('--badge-k', (bandH * 0.0742 / 37).toString());
          document.documentElement.style.setProperty('--tp-hero-fs', Math.round(bandH * TP.heroFs) + 'px');
          document.documentElement.style.setProperty('--tp-hero-b', Math.round(bandH * TP.heroBot) + 'px');
          return;
        }

        // Mode A: Landscape
        if (currentMode !== 'land') {
          clearInline();
          document.body.classList.remove('tabport', 'stacked');
          currentMode = 'land';
        }

        var pr = photoRatio(vw);
        var photoW = Math.round(vw * pr);
        var paneW = vw - photoW;

        photoEl.style.width = photoW + 'px';
        paneEl.style.left = photoW + 'px';
        paneEl.style.width = paneW + 'px';

        seatHero(photoW, vh);
        placeCard(paneW, vh);
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout);
      if (mqLandscape.addEventListener) {
        mqLandscape.addEventListener('change', layout);
        mqPortrait.addEventListener('change', layout);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    })();
  </script>

  <!-- 7. Entrance Animation (IIFE 2) -->
  <script>
    (function() {
      function releaseEntrance() {
        document.documentElement.classList.remove('entry-pending');
        if (window.__entryFallback) {
          clearTimeout(window.__entryFallback);
          window.__entryFallback = null;
        }
      }

      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced || !Element.prototype.animate) {
        releaseEntrance();
        return;
      }

      var ease = 'cubic-bezier(.16,1,.3,1)';
      var softEase = 'cubic-bezier(.22,1,.36,1)';
      var compact = window.matchMedia('(max-width:699px)').matches;

      var steps = [
        {
          el: document.querySelector('.card'),
          delay: 40,
          duration: 820,
          easing: ease,
          from: { opacity: 0, transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.querySelector('.badge'),
          delay: 120,
          duration: 480,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('hl1'),
          delay: 240,
          duration: 760,
          easing: ease,
          from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' },
          to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
        },
        {
          el: document.getElementById('hl2'),
          delay: 330,
          duration: 760,
          easing: ease,
          from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' },
          to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
        },
        {
          el: document.getElementById('h1'),
          delay: 470,
          duration: 620,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(10px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('sub'),
          delay: 570,
          duration: 560,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(10px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('email'),
          delay: 720,
          duration: 520,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('pw'),
          delay: 790,
          duration: 520,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(8px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('loginBtn'),
          delay: 930,
          duration: 560,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(8px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.querySelector('.divider'),
          delay: 1060,
          duration: 440,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(6px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('gBtn'),
          delay: 1150,
          duration: 540,
          easing: ease,
          from: { opacity: 0, transform: 'translateY(8px)' },
          to: { opacity: 1, transform: 'none' }
        },
        {
          el: document.getElementById('bottom'),
          delay: 1260,
          duration: 500,
          easing: softEase,
          from: { opacity: 0, transform: 'translateY(6px)' },
          to: { opacity: 1, transform: 'none' }
        }
      ];

      var fontPromise = (document.fonts && document.fonts.ready)
        ? document.fonts.ready
        : Promise.resolve();

      Promise.race([
        fontPromise,
        new Promise(function(r) { setTimeout(r, 650); })
      ]).then(function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            var anims = [];
            steps.forEach(function(s) {
              if (!s.el) return;
              var a = s.el.animate([s.from, s.to], {
                delay: s.delay,
                duration: s.duration,
                easing: s.easing,
                fill: 'both'
              });
              anims.push(a);
            });

            releaseEntrance();

            Promise.allSettled(anims.map(function(a) { return a.finished; })).then(function() {
              anims.forEach(function(a) { a.cancel(); });
              anims.length = 0;
            });
          });
        });
      });
    })();
  </script>
