    // --- FadingVideo Component (JS Crossfade, No CSS transitions) ---
    function FadingVideo({ src, className = "", style = {} }) {
      const videoRef = React.useRef(null);
      const rafIdRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);
      const timeoutIdRef = React.useRef(null);

      const fadeTo = (targetOpacity, durationMs = 500) => {
        if (rafIdRef.current) {
          cancelAnimationFrame(rafIdRef.current);
          rafIdRef.current = null;
        }

        const video = videoRef.current;
        if (!video) return;

        const startOpacity = parseFloat(video.style.opacity) || 0;
        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / durationMs);
          const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
          if (video) {
            video.style.opacity = currentOpacity;
          }
          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(step);
          } else {
            rafIdRef.current = null;
          }
        };

        rafIdRef.current = requestAnimationFrame(step);
      };

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        video.style.opacity = "0";

        const handleLoadedData = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1, 500);
        };

        const handleTimeUpdate = () => {
          if (!video.duration) return;
          const timeLeft = video.duration - video.currentTime;
          if (!fadingOutRef.current && timeLeft <= 0.55 && timeLeft > 0) {
            fadingOutRef.current = true;
            fadeTo(0, 500);
          }
        };

        const handleEnded = () => {
          video.style.opacity = "0";
          if (timeoutIdRef.current) clearTimeout(timeoutIdRef.current);
          timeoutIdRef.current = setTimeout(() => {
            if (video) {
              video.currentTime = 0;
              video.play().catch(() => {});
              fadingOutRef.current = false;
              fadeTo(1, 500);
            }
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        if (video.readyState >= 2) {
          video.play().catch(() => {});
          fadeTo(1, 500);
        }

        return () => {
          if (rafIdRef.current) cancelAnimationFrame(rafIdRef.current);
          if (timeoutIdRef.current) clearTimeout(timeoutIdRef.current);
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ ...style, opacity: 0 }}
        />
      );
    }

    // --- BlurText Component (Word-by-word blur-in) ---
    function BlurText({ text, className = "", delay = 0 }) {
      const containerRef = React.useRef(null);
      const [inView, setInView] = React.useState(false);

      React.useEffect(() => {
        const el = containerRef.current;
        if (!el) return;

        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );

        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const words = text.split(" ");

      return (
        <p
          ref={containerRef}
          className={className}
          style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}
        >
          {words.map((word, i) => {
            const wordDelay = delay + (i * 100) / 1000;
            return (
              <motion.span
                key={i}
                style={{ display: "inline-block", marginRight: "0.28em" }}
                initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                animate={inView ? {
                  filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                  opacity: [0, 0.5, 1],
                  y: [50, -5, 0]
                } : { filter: 'blur(10px)', opacity: 0, y: 50 }}
                transition={{
                  duration: 0.7,
                  times: [0, 0.5, 1],
                  ease: "easeOut",
                  delay: wordDelay
                }}
              >
                {word}
              </motion.span>
            );
          })}
        </p>
      );
    }
